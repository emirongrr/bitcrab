[package]
name = "bitcrab-test"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
bitcrab-common = { path = "../crates/common" }
bitcrab-net = { path = "../crates/net" }
bitcrab-storage = { path = "../crates/storage" }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util.workspace = true
proptest = "1.4"
rand = { version = "0.8", features = ["small_rng"] }
bitcrab-node = { path = "../crates/node" }
bitcrab-consensus = { path = "../crates/consensus" }
hex = "0.4"
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"

[[test]]
name = "bitcrab_tests"
path = "tests/tests.rs"

[dependencies]
async-trait = "0.1.89"
